name: Pruebas automatizadas - Inventario

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: admin123
          MYSQL_DATABASE: inventario_pruebas
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -padmin123 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_NAME: inventario_pruebas
      DB_USER: root
      DB_PASSWORD: admin123

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql

      - name: Verificar sintaxis
        run: |
          php -l src/funciones.php
          php -l tests/test_validaciones.php
          php -l tests/conexion_pruebas.php
          php -l tests/test_integracion_productos.php

      - name: Crear tabla de pruebas
        env:
          MYSQL_PWD: ${{ env.DB_PASSWORD }}
        run: |
          mysql --protocol=TCP \
            --host="$DB_HOST" \
            --user="$DB_USER" \
            "$DB_NAME" < tests/estructura_pruebas.sql

      - name: Ejecutar pruebas unitarias
        run: php tests/test_validaciones.php

      - name: Ejecutar prueba de integración
        run: php tests/test_integracion_productos.php