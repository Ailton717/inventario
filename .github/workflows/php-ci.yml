name: Pruebas automatizadas - inventario

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Verificar sintaxis
        run: |
          find . -name "*.php" -not -path "./.git/*" -not -path "./.claude/*" \
            -print0 | xargs -0 -r -n1 php -l

      - name: Ejecutar pruebas
        run: php test/test_validaciones.php
